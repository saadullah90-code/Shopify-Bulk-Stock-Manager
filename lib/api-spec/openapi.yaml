openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: App password session
  - name: shopify
    description: Shopify inventory preview and updates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Check whether the current browser session is authenticated
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a session with the configured app password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Missing app password configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /shopify/locations:
    get:
      operationId: getLocations
      tags: [shopify]
      summary: List active Shopify inventory locations
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Active inventory locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify connection or API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /shopify/preview:
    post:
      operationId: previewOrders
      tags: [shopify]
      summary: Read orders and inventory without changing stock
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewInput"
      responses:
        "200":
          description: A read-only inventory preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify connection or API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /shopify/apply:
    post:
      operationId: applyChanges
      tags: [shopify]
      summary: Apply only the variants included in a confirmed preview
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyInput"
      responses:
        "200":
          description: Per-variant update outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResponse"
        "400":
          description: Invalid request or missing confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Preview inventory is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired or server restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify connection or API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sbsm_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    LoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 512
      required: [password]
    Location:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
      required: [id, name, active]
    LocationsResponse:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
      required: [locations]
    PreviewInput:
      type: object
      properties:
        orders:
          type: string
          maxLength: 20000
        action:
          type: string
          enum: [sold_out, in_stock]
      required: [orders, action]
    OrderResult:
      type: object
      properties:
        entered:
          type: string
        status:
          type: string
          enum: [found, not_found, ambiguous, inaccessible]
        orderName:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
      required: [entered, status, orderName, reason]
    InventoryLocationResult:
      type: object
      properties:
        locationId:
          type: string
        name:
          type: string
        active:
          type: ["boolean", "null"]
          description: Null when active status is not required or requested for a tracking-only action.
        stocked:
          type: boolean
        currentQuantity:
          type: ["integer", "null"]
        targetQuantity:
          type: ["integer", "null"]
        updateStatus:
          type: string
          enum: [pending, success, failed, skipped]
        updateMessage:
          type: ["string", "null"]
      required: [locationId, name, active, stocked, currentQuantity, targetQuantity, updateStatus, updateMessage]
    VariantResult:
      type: object
      properties:
        inventoryItemId:
          type: string
        productTitle:
          type: string
        variantTitle:
          type: string
        orderNumbers:
          type: array
          items:
            type: string
        productStatus:
          type: ["string", "null"]
        tracked:
          type: boolean
        inventoryPolicy:
          type: ["string", "null"]
          enum: [DENY, CONTINUE, null]
        targetTracked:
          type: boolean
        locations:
          type: array
          items:
            $ref: "#/components/schemas/InventoryLocationResult"
        eligible:
          type: boolean
        skipReason:
          type: ["string", "null"]
        warning:
          type: ["string", "null"]
        updateStatus:
          type: string
          enum: [pending, success, failed, skipped]
        updateMessage:
          type: ["string", "null"]
      required:
        - inventoryItemId
        - productTitle
        - variantTitle
        - orderNumbers
        - productStatus
        - tracked
        - inventoryPolicy
        - targetTracked
        - locations
        - eligible
        - skipReason
        - warning
        - updateStatus
        - updateMessage
    Summary:
      type: object
      properties:
        inputOrders:
          type: integer
        validOrders:
          type: integer
        variantsFound:
          type: integer
        successfulUpdates:
          type: integer
        failedUpdates:
          type: integer
        skippedItems:
          type: integer
      required:
        - inputOrders
        - validOrders
        - variantsFound
        - successfulUpdates
        - failedUpdates
        - skippedItems
    PreviewResponse:
      type: object
      properties:
        previewId:
          type: string
        action:
          type: string
          enum: [sold_out, in_stock]
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderResult"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantResult"
        summary:
          $ref: "#/components/schemas/Summary"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - previewId
        - action
        - orders
        - variants
        - summary
        - createdAt
        - expiresAt
    ApplyInput:
      type: object
      properties:
        previewId:
          type: string
          minLength: 1
        confirmed:
          type: boolean
      required: [previewId, confirmed]
    ApplyResponse:
      type: object
      properties:
        previewId:
          type: string
        action:
          type: string
          enum: [sold_out, in_stock]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantResult"
        summary:
          $ref: "#/components/schemas/Summary"
      required: [previewId, action, variants, summary]

